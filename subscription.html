<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe</title>

<!--
  PAYPAL SETUP
  1. In PayPal Developer Dashboard (developer.paypal.com) create an app → copy its Client ID.
  2. In your PayPal Business account: Pay & Get Paid → Subscriptions → create a Product,
     then two Plans (one billed monthly, one billed yearly). Copy each Plan ID (starts with "P-").
  3. Paste the values into CONFIG below and into the script URL.
  4. Test with sandbox credentials first, then switch to live.
-->
<script src="https://www.paypal.com/sdk/js?client-id=Af5EVauG1w5LetCgqZTiAKSlv3pI9EVHIagrzf65c6ipiH8jiEFWNU1DHqS27a_qgQkRG4lphsvjOFhI&vault=true&intent=subscription&currency=CHF" data-sdk-integration-source="button-factory"></script>

<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1b1f2a; --muted: #6b7280;
    --accent: #0070ba; --accent-soft: #e6f1fa; --border: #e5e7eb; --save: #0a8a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { margin: 0 0 24px; color: var(--muted); }

  .toggle {
    display: grid; grid-template-columns: 1fr 1fr; background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 24px;
  }
  .toggle button {
    border: 0; background: transparent; padding: 10px; border-radius: 999px;
    font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .toggle button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .badge { font-size: .72rem; color: var(--save); margin-left: 4px; }

  .price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .price .amount { font-size: 2.6rem; font-weight: 800; }
  .price .period { color: var(--muted); }
  .note { min-height: 1.3em; margin: 0 0 20px; color: var(--save); font-size: .9rem; font-weight: 600; }

  ul { list-style: none; padding: 0; margin: 0 0 24px; }
  li { padding: 6px 0 6px 26px; position: relative; }
  li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

  #paypal-button-container { min-height: 50px; }
  .alt { margin: 12px 0 0; text-align: center; font-size: .85rem; color: var(--muted); }
  .alt a { color: var(--accent); font-weight: 600; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: #e8f7ee; color: #0a6b3a; }
  .msg.err { display: block; background: #fdecec; color: #a01d1d; }
</style>
</head>
<body>

<main class="card">
  <h1>Pro Plan</h1>
  <p class="sub">Everything you need. Cancel anytime.</p>

  <div class="toggle" role="tablist">
    <button id="btn-monthly" class="active" type="button">Monthly</button>
    <button id="btn-yearly" type="button">Yearly <span class="badge">Save</span></button>
  </div>

  <div class="price">
    <span class="amount" id="amount">CHF 6.00</span>
    <span class="period" id="period">/ month</span>
  </div>
  <p class="note" id="note"></p>

  <ul>
    <li>Unlimited projects</li>
    <li>Priority support</li>
    <li>All future updates</li>
  </ul>

  <div id="paypal-button-container"></div>
  <p class="alt">Button not showing? <a id="paypal-link" href="https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-9A7408758Y077321TNLF367A" target="_blank" rel="noopener">Subscribe directly on PayPal</a></p>
  <div class="msg" id="msg"></div>
</main>

<script>
  // ===== CONFIG: edit these =====
  const CONFIG = {
    currencySymbol: "CHF ",
    monthly: { planId: "P-9A7408758Y077321TNLF367A", price: 6.00 },
    yearly:  { planId: "P-7R818960PF594525PNLF37ZA", price: 50.00 }
  };
  // ==============================

  let current = "monthly";
  const $ = id => document.getElementById(id);

  function updatePrice() {
    const p = CONFIG[current];
    $("amount").textContent = CONFIG.currencySymbol + p.price.toFixed(2);
    $("period").textContent = current === "monthly" ? "/ month" : "/ year";
    if (current === "yearly") {
      const save = CONFIG.monthly.price * 12 - CONFIG.yearly.price;
      const pct = Math.round(save / (CONFIG.monthly.price * 12) * 100);
      $("note").textContent = save > 0 ? `You save ${CONFIG.currencySymbol}${save.toFixed(2)} (${pct}%) per year` : "";
    } else {
      $("note").textContent = "";
    }
    $("paypal-link").href = "https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=" + encodeURIComponent(p.planId);
  }

  function showMsg(text, type) {
    const m = $("msg");
    m.className = "msg " + type;
    m.textContent = text;
  }

  function renderPayPal() {
    const container = $("paypal-button-container");
    container.innerHTML = "";
    if (typeof paypal === "undefined") {
      showMsg("PayPal could not load. Check your Client ID in the script URL.", "err");
      return;
    }
    paypal.Buttons({
      style: { shape: "rect", color: "gold", layout: "vertical", label: "subscribe" },
      createSubscription: (data, actions) =>
        actions.subscription.create({ plan_id: CONFIG[current].planId }),
      onApprove: (data) => {
        showMsg(`Thanks! Your ${current} subscription is active. ID: ${data.subscriptionID}`, "ok");
        // IMPORTANT: send data.subscriptionID to your server and verify it with
        // PayPal's API (GET /v1/billing/subscriptions/{id}) before granting access.
        // fetch("/api/subscriptions", { method: "POST", headers: {"Content-Type":"application/json"},
        //   body: JSON.stringify({ subscriptionID: data.subscriptionID, plan: current }) });
      },
      onCancel: () => showMsg("Checkout cancelled. You haven't been charged.", "err"),
      onError: (err) => { console.error(err); showMsg("Something went wrong with PayPal. Please try again.", "err"); }
    }).render("#paypal-button-container");
  }

  function select(plan) {
    current = plan;
    $("btn-monthly").classList.toggle("active", plan === "monthly");
    $("btn-yearly").classList.toggle("active", plan === "yearly");
    $("msg").className = "msg";
    updatePrice();
    renderPayPal();
  }

  $("btn-monthly").addEventListener("click", () => select("monthly"));
  $("btn-yearly").addEventListener("click", () => select("yearly"));

  updatePrice();
  renderPayPal();
</script>
</body>
</html>
